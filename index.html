<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fonte</title>
<meta name="theme-color" content="#efeee9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de salle net et énergique, lisible d'une main entre deux séries
   IDEA: la forge : Gus, golem de fonte, grandit et évolue avec ton entraînement
   PICTURE: Gus vivant sur sa carte bleue ; ses évolutions en cinématique de forge ; chaque trophée est un disque
   COLOUR and TYPE: craie et caoutchouc ; bleu du disque 20 kg dominant, jaune 15 kg en accent, rouge 25 kg pour les records ; Barlow Condensed + Barlow
   LAYOUT: colonne mobile de 560px max, onglets en bas, séance plein écran avec minuteur de repos ancré en bas */
:root{color-scheme:light dark;
 --bg:light-dark(#efeee9,#0f1114);--card:light-dark(#fff,#181b20);--card2:light-dark(#f4f3ef,#22262d);
 --ink:light-dark(#121418,#eceef2);--mute:light-dark(#5b606a,#9ea4af);--line:light-dark(#dedcd5,#2c3139);
 --blue:light-dark(#1f4fd1,#6a8fff);--btn:#1f4fd1;--bsoft:light-dark(#e3eaff,#1b2547);
 --yel:#f4bf26;--red:light-dark(#cc2e29,#ff6a61);--rsoft:light-dark(#fde5e3,#3b1d1c);--grn:light-dark(#1d7a46,#52c584);
 --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fc:'Barlow Condensed','Barlow',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
h1{font:700 34px/1.05 var(--fc);margin:0;text-wrap:balance}
h2{font:700 22px/1.15 var(--fc);margin:0}
h3{font:700 18px/1.2 var(--fc);margin:0}
p{margin:0}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(96px + env(safe-area-inset-bottom))}
body.live #app{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:12px}
.brand{font:700 30px/1 var(--fc);display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
.sec{margin-top:28px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{display:grid;gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font:700 26px/1 var(--fc)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1}
.btn{appearance:none;border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--btn);color:#fff}
.btn.big{min-height:58px;width:100%;border-radius:14px;font:700 21px var(--fc)}
.btn.line{background:transparent;border:1px solid var(--line)}
.btn.warn{color:var(--red)}
.btn.del{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn .i{width:20px;height:20px}
.ib{appearance:none;width:44px;height:44px;flex:none;border:0;border-radius:12px;display:grid;place-items:center;background:transparent;color:inherit;font-weight:600;font-size:15px}
.ib.bg{background:var(--card2)}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.k{stroke-width:3.5}.i.s{width:16px;height:16px}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.link{appearance:none;background:none;border:0;padding:0 2px;min-height:44px;color:var(--blue);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;white-space:nowrap;border:0;color:inherit}
.chip.pr{background:var(--rsoft);color:var(--red)}
.chip.ok{background:var(--bsoft);color:var(--blue)}
/* niveau */
.lvl{background:var(--btn);color:#fff;border-radius:20px;padding:18px 18px 14px;border:0;width:100%;text-align:left;display:block;font:inherit}
.lvl-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lvl-n{font:700 44px/1 var(--fc)}
.lvl-t{font:600 18px/1.2 var(--fc);opacity:.85;margin-top:2px}
.lvl-x{font-size:14px;opacity:.9}
.bar-svg{display:block;width:100%;height:auto;margin:8px 0 6px}
.lvl-f{display:flex;justify-content:space-between;gap:12px;font-size:14px;opacity:.92;flex-wrap:wrap;margin-top:8px}
.lvl-k{text-align:right}.lvl-k b{display:block;font:700 30px/1 var(--fc)}.lvl-k span{font-size:13px;opacity:.85}
.lvl-p{height:8px;border-radius:4px;background:rgb(255 255 255 / .22);overflow:hidden}.lvl-p i{display:block;height:100%;background:var(--yel);border-radius:4px}
.plg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;font-weight:600}.plg i{display:inline-block;width:9px;height:20px;border-radius:2px;margin-right:6px;vertical-align:-5px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .18)}
.gain{background:var(--card2);border-radius:14px;padding:12px 14px}
.pb2{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pb2 i{position:absolute;top:0;bottom:0;left:0;background:var(--blue)}
.pb2 i.nw{background:var(--yel);transform-origin:left;animation:gr .9s .25s ease-out both}
@keyframes gr{from{transform:scaleX(0)}}
.nl{animation:pl .55s cubic-bezier(.2,.8,.2,1.15) both}.nr{animation:pr .55s cubic-bezier(.2,.8,.2,1.15) both}
@keyframes pl{from{transform:translateX(-28px);opacity:0}}@keyframes pr{from{transform:translateX(28px);opacity:0}}
/* semaine */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.day{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mute)}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.dot .i{width:18px;height:18px;stroke-width:3}
.day.on .dot{background:var(--yel);border-color:var(--yel);color:#16181c}
.day.today .dot{border-color:var(--blue)}.day.today{color:var(--ink);font-weight:700}
.streak{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.streak .i{color:var(--red)}
.pbar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--yel);border-radius:4px}
.pbar.b>i{background:var(--blue)}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.q .pbar{grid-column:1/-1}
.q .qt{font-weight:600}
.q.done .pbar>i{background:var(--grn)}
.tpl h3{font-size:20px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0;min-height:44px}
.demo{display:flex;align-items:center;gap:12px;background:var(--bsoft);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px;font-size:14px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{appearance:none;border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--mute)}
.nav button[aria-current=page]{color:var(--blue)}
#live{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:19;padding:0 12px 8px;display:flex;justify-content:center;pointer-events:none}
#live button{pointer-events:auto;width:100%;max-width:536px;min-height:52px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--yel);animation:pu 1.6s infinite}
@keyframes pu{50%{opacity:.35}}
/* séance */
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.wo[hidden]{display:none}
.wo-h{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.wo-hi{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.wo-name{width:100%;border:0;background:transparent;font:700 22px/1.1 var(--fc);padding:6px;border-radius:8px}
.wo-name:focus{background:var(--card2);outline:none}
.clock{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;padding:0 6px}
.wo-b{max-width:560px;margin:0 auto;padding:14px 12px calc(150px + env(safe-area-inset-bottom));display:grid;gap:12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.ex-h{display:flex;gap:4px;align-items:flex-start}
.ex-n{font:700 20px/1.15 var(--fc);padding-top:4px}
.ex-m{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ex-m .chip{min-height:32px;padding:0 10px}
.prev{font-size:13px;color:var(--mute);margin:8px 0 10px}
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 50px 48px;gap:6px;align-items:center}
.rsd{text-align:center;font-size:14px;color:var(--mute)}
.sr{display:contents}
.sets .hd{font-size:13px;color:var(--mute);text-align:center;font-weight:600;line-height:1.2}
.sn{font:700 16px var(--fc);text-align:center;color:var(--mute)}
.sets input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:18px;text-align:center;padding:0 2px;font-variant-numeric:tabular-nums}
.sets input.rs{font-size:16px;font-weight:500}
.sets input::placeholder{color:var(--mute);opacity:.6;font-weight:500}
.chk{width:48px;height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--mute)}
.chk .i{stroke-width:3}
.sr.done input{background:var(--bsoft);border-color:transparent}
.sr.done .chk{background:var(--btn);border-color:var(--btn);color:#fff}
.sr.pr .sn{color:var(--red)}
.ex-f{display:flex;gap:8px;margin-top:10px}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgb(0 0 0 / .18)}
.rest-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 10px;align-items:center}
.rest .t{font:700 38px/1 var(--fc);font-variant-numeric:tabular-nums}
.rest .l{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .adj{display:flex;gap:6px}
.rest .ib{background:rgb(127 127 127 / .22)}
.rest .go{background:var(--yel);color:#16181c}
.rest .trk{grid-column:1/-1;height:4px;border-radius:2px;background:rgb(127 127 127 / .35);overflow:hidden}
.rest .trk i{display:block;height:100%;background:var(--yel)}
.rest.over{background:var(--yel);color:#16181c}
.rest.over .go{background:#16181c;color:var(--yel)}
.rest.over .trk i{background:#16181c}
/* feuilles */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(10 12 16 / .5);display:flex;align-items:flex-end;justify-content:center;animation:fa .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sh-h{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.sh-h h2{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fa{from{opacity:0}}
.fld{display:grid;gap:6px}.fld>span{font-size:14px;font-weight:600;color:var(--mute)}
.in{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 14px;font-size:16px}
select.in{appearance:none;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
textarea.in{padding:12px 14px;min-height:120px;font-size:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;min-height:44px;border-radius:9px;font-weight:600;color:var(--mute);font-size:15px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);min-height:44px;padding:0 14px;border-radius:999px;font-weight:600;font-size:15px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step{display:flex;align-items:center;gap:4px}
.step .v{min-width:56px;text-align:center;font:700 22px var(--fc)}
.step.lg{justify-content:center;gap:16px}.step.lg .v{font-size:40px;min-width:110px}
.sw{appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.sw:checked{background:var(--btn)}.sw:checked::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0;padding-bottom:0}.setrow:first-child{padding-top:0}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;min-height:58px}
.pick .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pick .ck .i{width:16px;height:16px;stroke-width:3}
.pick[aria-pressed=true] .ck{background:var(--btn);border-color:var(--btn);color:#fff}
.pick b{display:block;font-weight:600}
.pk-f{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--card);padding:12px 0 calc(8px + env(safe-area-inset-bottom));margin-bottom:calc(-20px - env(safe-area-inset-bottom))}
.te{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.te-c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.te-c .xs{display:block;margin-bottom:2px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 10px}
.bdg{display:grid;justify-items:center;text-align:center;gap:4px;align-content:start}
.bdg svg{width:64px;height:64px}
.bdg b{font:700 16px/1.1 var(--fc);margin-top:2px}
.bdg span{font-size:13px;color:var(--mute);line-height:1.3}
.bdg.off b{color:var(--mute)}
/* progrès */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .v{font:700 30px/1.1 var(--fc);margin:2px 0}
.kpi .d{font-size:13px}.up{color:var(--grn)}.dn{color:var(--red)}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:130px}
.cols i{display:block;border-radius:4px 4px 0 0;background:var(--line);min-height:2px}
.cols i.cur{background:var(--btn)}
.cols-x{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.mrow .pbar{height:10px}.mrow>span:last-child{text-align:right}
.fig{position:relative;height:230px;margin-top:12px}
.fig.s{height:180px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{font:500 13px var(--f);fill:var(--mute)}
.c-ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-ar{fill:var(--blue);opacity:.1}
.c-gl{stroke:var(--line);stroke-width:1}
.c-pt{fill:var(--card);stroke:var(--blue);stroke-width:2}
.c-pt.pr{fill:var(--red);stroke:var(--red)}
.c-goal{stroke:var(--yel);stroke-width:2;stroke-dasharray:6 5}
.lgd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:0}
.lgd.y{border-radius:0;height:3px;width:16px;background:var(--yel);vertical-align:3px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:16px}
.stats b{display:block;font:700 22px/1.15 var(--fc)}
.hl{display:grid;gap:10px;margin-top:16px}
.hl>div{display:flex;gap:10px;align-items:baseline;font-size:14px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
/* historique */
.month{font:700 18px var(--fc);color:var(--mute);margin:24px 0 10px;text-transform:capitalize}
.hc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit}
.hd-day{width:44px;flex:none;text-align:center;line-height:1.05}
.hd-day b{display:block;font:700 28px var(--fc)}
.hd-day span{font-size:13px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;color:var(--mute)}
.sd{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dl{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px;font-size:15px;align-items:center;margin-top:6px}
.dl .sn{font-size:15px}
.ed{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin-top:8px}
.ed input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);text-align:center;font-weight:600;font-size:16px}
.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.k3>div{background:var(--card2);border-radius:12px;padding:10px 12px}
.k3 b{display:block;font:700 22px/1.1 var(--fc)}
/* résumé */
.xpbig{font:700 60px/1 var(--fc);color:var(--blue)}
.brk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-size:15px}
.brk b{text-align:right;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:28px 16px}

/* Gus, le compagnon */
.g-card{background:var(--btn);color:#fff;border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.g-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.g-n{font:700 40px/1 var(--fc)}.g-s{font:600 17px/1.2 var(--fc);opacity:.88;margin-top:2px}
.g-l{font:700 26px/1 var(--fc)}
.g-scene{position:relative;height:262px;margin-top:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.g-shadow{position:absolute;left:50%;bottom:8px;height:16px;border-radius:50%;background:rgb(0 0 0 / .28);filter:blur(3px)}
.g-fig{position:absolute;left:50%;bottom:6px;width:262px;height:262px;margin-left:-131px;transform-origin:50% 97%}
.g-fig img,.g-top{position:absolute;inset:0;width:100%;height:100%}
.g-fig img{display:block;user-select:none;-webkit-user-drag:none}
.g-lid{clip-path:inset(0 0 100% 0)}
.g-glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgb(255 120 90 / .9),rgb(255 80 60 / 0) 70%);mix-blend-mode:screen;pointer-events:none;opacity:.1}
.g-bub{position:absolute;right:0;top:0;max-width:170px;background:#fff;color:#16181c;font-size:14px;line-height:1.35;font-weight:500;padding:9px 11px;border-radius:14px 14px 14px 4px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.g-bub.on{opacity:1;transform:none}
.g-evo{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgb(255 255 255 / .2)}

.g-evo b{display:block;font-size:15px}.g-evo span{font-size:13px;opacity:.85}
.g-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g-st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 10px;text-align:center}
.g-im{border-radius:10px;background:var(--bsoft);aspect-ratio:1;overflow:hidden}.g-im img{width:100%;height:100%;display:block}
.g-st b{display:block;font:700 16px var(--fc);margin-top:6px}.g-st span{font-size:13px;color:var(--mute)}
.g-st.cur{border:2px solid var(--btn)}.g-st.cur .g-im{background:#1f4fd1}
.g-st.lock .g-im{background:var(--card2)}.g-st.lock img{filter:brightness(0);opacity:.22}

.cine{position:fixed;inset:0;z-index:70;background:#000;color:#fff;overflow:hidden;opacity:0;display:none}

.c-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

.c-white{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,#fffaf0,#ffc46b 40%,#ff5a00);opacity:0;pointer-events:none;z-index:4}
.c-lb{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:5;transform:scaleY(0)}
.c-lb.t{top:0;transform-origin:top}.c-lb.b{bottom:0;transform-origin:bottom}

/* ---------- données ---------- */
function fresh(){return{v:1,settings:{goal:3,rest:90,wake:true,sound:true,gusName:'Gus'},custom:[],templates:[
 {id:'t-a',name:'Full body A',items:[{ex:'squat',n:3,rest:150},{ex:'dc-barre',n:3,rest:120},{ex:'rowing-barre',n:3,rest:120},{ex:'elev-lat',n:3,rest:60},{ex:'crunch',n:3,rest:60}]},
 {id:'t-b',name:'Full body B',items:[{ex:'sdt-roumain',n:3,rest:150},{ex:'dm-barre',n:3,rest:120},{ex:'tirage-vert',n:3,rest:90},{ex:'fentes',n:3,rest:90},{ex:'curl-halt',n:3,rest:60}]}],
 sessions:[],body:[],goals:[],active:null,demo:false,lastExport:0,base:{}}}
let storeOk=true;
function load(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t),f=fresh();return{...f,...d,settings:{...f.settings,...(d.settings||{})}}}}catch(e){storeOk=false}return fresh()}
let S=load(),D=null,saveT=0;

const need=L=>400+150*L;

const QP=[

function pickQ(k){let s=(Math.round(new Date(k+'T00:00:00').getTime()/6048e5)%10000+10000)*9301+49297;const a=[0,1,2,3,4,5];for(let i=5;i>0;i--){s=(s*9301+49297)%233280;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,3).map(i=>QP[i])}
const BADGES=[
 ['s1','Premier pas','Terminer une première séance','1','g',c=>c.n>=1],['s10','Dix séances','Terminer 10 séances','10','y',c=>c.n>=10],['s50','Pilier','Terminer 50 séances','50','b',c=>c.n>=50],['s100','Centurion','Terminer 100 séances','100','r',c=>c.n>=100],
 ['p1','Premier record','Battre un record perso','PR','g',c=>c.prs>=1],['p25','Chasseur de records','Battre 25 records','25','b',c=>c.prs>=25],

const emptyW=k=>({k,n:0,v:0,sets:0,prs:0,mus:new Set(),ok:0,nw:0,days:new Set()});

function derive(){
 if(D)return D;
 const ss=[...S.sessions].sort((a,b)=>a.start-b.start),goal=S.settings.goal;
 const best={},bestR={},hist={},weeks={},st={},prs=[],seen=new Set();
 const xp={seance:0,series:0,volume:0,records:0,semaine:0,defis:0,objectifs:0,trophees:0};
 let tVol=0,tSets=0,tPr=0,tOk=0,early=false,night=false;
 for(const s of ss){
  const k=wk(s.start),W=weeks[k]||(weeks[k]=emptyW(k));
  let v=0,n=0,ok=0;const p=[],mus=new Set();
  for(const it of s.items){
   if(!it.sets.length)continue;
   mus.add(exInfo(it.ex).m);
   if(!seen.has(it.ex)){seen.add(it.ex);W.nw++}
   const tgt=it.rest||S.settings.rest;
   let mx=0,mr=0,mw=0,rx=0,iv=0,rs=0,rc=0,bw=null,br=null;
   for(const x of it.sets){const e=e1(x.w,x.r);v+=x.w*x.r;iv+=x.w*x.r;n++;
    if(e>mx){mx=e;bw=x}if(!x.w&&x.r>mr){mr=x.r;br=x}mw=Math.max(mw,x.w);rx=Math.max(rx,x.r);
    if(x.rest>0){rs+=x.rest;rc++;if(x.rest<=tgt+20)ok++}}
   const bs=mx>0?bw:br,pe=best[it.ex],pr=bestR[it.ex];let isPr=false;
   if(mx>0){if(pe!==undefined&&mx>pe+.01)isPr=true;if(pe===undefined||mx>pe)best[it.ex]=mx}
   else if(mr>0){if(pr!==undefined&&mr>pr)isPr=true;if(pr===undefined||mr>pr)bestR[it.ex]=mr}
   if(isPr){p.push({ex:it.ex,set:bs});prs.push({ex:it.ex,set:bs,t:s.start})}
   (hist[it.ex]||(hist[it.ex]=[])).push({t:s.start,sid:s.id,e:mx,w:mw,r:rx,v:iv,rest:rc?rs/rc:null,sets:it.sets,pr:isPr,best:bs});

function niceStep(x){const p=10**Math.floor(Math.log10(x)),m=x/p;return(m<1.5?1:m<3?2:m<7?5:10)*p}
function chart(host,pts,fmt,goal){

  const pl=50,pr=12,pt=12,pb=28,ys=pts.map(p=>p.y).concat(goal!=null?[goal]:[]);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1e-6){lo-=1;hi+=1}const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  const t0=pts[0].t,t1=pts[pts.length-1].t,iw=W-pl-pr,ih=H-pt-pb;
  const X=t=>pl+(t1===t0?iw/2:(t-t0)/(t1-t0)*iw),Y=v=>pt+(hi-v)/(hi-lo)*ih;
  const step=niceStep((hi-lo)/3);let o='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){const y=Y(v);o+=`<line class="c-gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${esc(fmt(v,true))}</text>`}
  if(goal!=null)o+=`<line class="c-goal" x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}"/>`;
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  o+=`<path class="c-ar" d="${line}L${X(t1).toFixed(1)} ${pt+ih}L${X(t0).toFixed(1)} ${pt+ih}Z"/><path class="c-ln" d="${line}"/>`;
  const dense=pts.length>40;
  pts.forEach((p,i)=>{if(dense&&!p.pr&&i!==pts.length-1)return;o+=`<circle class="c-pt${p.pr?' pr':''}" cx="${X(p.t)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:3.5}"/>`});
  o+=`<text x="${pl}" y="${H-6}">${esc(fmtD(t0))}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(fmtD(t1))}</text>`;
  svg.innerHTML=o};
 const ro=new ResizeObserver(draw);ro.observe(svg);ROs.push(ro);
}

 if(w>0){if(hb===undefined)return false;const e=e1(w,r),sb=Math.max(0,...others.map(x=>e1(num(x.w)||0,num(x.r)||0)));return e>hb+.01&&e>sb+.01}
 if(hr===undefined)return false;const sb=Math.max(0,...others.filter(x=>!(num(x.w)>0)).map(x=>num(x.r)||0));return r>hr&&r>sb}

/* ---------- démo ---------- */
function makeDemo(){let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
 const A=[['squat',60,8,150,2.5],['dc-barre',50,8,120,2.5],['rowing-barre',45,10,120,2.5],['elev-lat',8,12,60,1],['crunch',0,15,60,0]];
 const B=[['sdt-roumain',60,10,150,2.5],['dm-barre',30,8,120,2.5],['tractions',0,5,120,0],['fentes',14,10,90,1],['curl-halt',10,10,60,1]];
 const st=fresh();st.demo=true;st.settings={...S.settings};
 const start=monday(Date.now());start.setDate(start.getDate()-56);
 let idx=0;
 for(let w=0;w<=8;w++)for(const dd of(w===3?[0,3]:[0,2,4])){
  const t=new Date(start);t.setDate(t.getDate()+w*7+dd);t.setHours(dd===4?9:18,Math.floor(rnd()*50),0,0);
  if(t.getTime()>Date.now()-2*3600e3)continue;
  const plan=idx%2?B:A,lv=Math.floor(idx/2);
  const items=plan.map(([ex,w0,r0,rest,inc])=>{const wt=w0+inc*Math.floor(lv*.5),rr=w0?r0:r0+Math.floor(lv/2);
   return{ex,rest,sets:[0,1,2].map(k=>({w:wt,r:Math.max(1,rr-(k&&rnd()<.55?k:0)),rest:k<2?Math.round(rest+rnd()*45-15):null}))}});
  st.sessions.push({id:'demo'+idx,name:plan===A?'Full body A':'Full body B',tpl:plan===A?'t-a':'t-b',start:t.getTime(),end:t.getTime()+(50+Math.floor(rnd()*22))*60000,items});idx++}
 for(let k=0;k<=56;k+=4){const t=new Date(start);t.setDate(t.getDate()+k);if(t.getTime()>Date.now())break;st.body.push({d:ymd(t),kg:Math.round((92.4-k*.05+rnd()*.6-.3)*10)/10})}
 const c=start.getTime();
 st.goals=[{id:'g1',type:'lift',ex:'dc-barre',kg:70,reps:5,created:c},{id:'g2',type:'sessions',n:30,until:null,created:c},{id:'g3',type:'body',kg:88,from:92.4,created:c}];
 return st}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(woOpen)wake(true);tick()}});
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){if(!S.settings.sound)return;try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
 try{if(!ac)return;[0,.25].forEach(dl=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+dl;o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}

/* ---------- actions ---------- */
const findTpl=id=>S.templates.find(x=>x.id===id);
const ACT={
 go:b=>go(b.dataset.r),
 close:()=>closeSheet(),
 askYes:()=>{const r=ASK;ASK=null;closeSheet();r&&r(true)},
 loadDemo:async()=>{if(S.sessions.length&&!S.demo)return;S=makeDemo();EXM=null;save();window.scrollTo(0,0);render();toast('Données d’exemple chargées')},
 clearDemo:async()=>{if(!await ask('Effacer les données d’exemple ?','Tu repars d’une app vierge, en gardant tes réglages.','Effacer',true))return;const s=S.settings;S=fresh();S.settings=s;EXM=null;save();render();toast('Données d’exemple effacées')},
 startFree:()=>startWO(),
 resume:()=>{woPushed=true;go('seance')},
 tplStart:b=>{const t=findTpl(b.dataset.id);if(t)startWO(t)},
 tplEdit:b=>openTpl(b.dataset.id),
 tplNew:()=>openTpl(null),
 teAdd:()=>{syncTE();const keep=TE;openPicker({onPick:ids=>{TE=keep;ids.forEach(ex=>TE.items.push({ex,n:3,rest:S.settings.rest}));renderTE()}})},
 teUp:b=>{syncTE();const i=+b.dataset.i;if(i>0){[TE.items[i-1],TE.items[i]]=[TE.items[i],TE.items[i-1]];renderTE()}},
 teDel:b=>{syncTE();TE.items.splice(+b.dataset.i,1);renderTE()},
 teN:b=>{syncTE();const it=TE.items[+b.dataset.i];it.n=clamp(it.n+ +b.dataset.d,1,10);renderTE()},
 teR:b=>{syncTE();const it=TE.items[+b.dataset.i];it.rest=clamp(it.rest+ +b.dataset.d,15,600);renderTE()},
 teSave:()=>{syncTE();const n=TE.name.trim();if(!n){toast('Donne un nom au modèle');$('#ten').focus();return}if(!TE.items.length){toast('Ajoute au moins un exercice');return}
  if(TE.id){const t=findTpl(TE.id);t.name=n;t.items=TE.items}else S.templates.push({id:uid(),name:n,items:TE.items});save();closeSheet();render();toast('Modèle enregistré')},
 teRemove:async()=>{const id=TE.id,t=findTpl(id);if(!await ask('Supprimer ce modèle ?',`« ${t.name} » sera retiré. Tes séances passées restent intactes.`,'Supprimer',true))return;S.templates=S.templates.filter(x=>x.id!==id);save();render();toast('Modèle supprimé')},
 woMin:()=>leaveWO(),
 woAdd:()=>openPicker({onPick:ids=>{if(!S.active)return;ids.forEach(ex=>{const p=lastSets(ex);S.active.items.push({ex,rest:S.settings.rest,base:baseOf(ex),sets:Array.from({length:p?p.sets.length:3},blank)})});save();renderWO();setTimeout(()=>{const w=$('#wo');w.scrollTo({top:w.scrollHeight,behavior:'smooth'})},50)}}),
 woCancel:async()=>{if(!await ask('Abandonner la séance ?','Les séries saisies seront perdues.','Abandonner',true))return;S.active=null;save();leaveWO()},
 woFinish:async()=>{const A=S.active,done=sum(A.items.map(it=>it.sets.filter(s=>s.done).length));
  if(!done){if(await ask('Aucune série validée','Valide au moins une série avec le bouton ✓ ou abandonne la séance.','Abandonner la séance',true)){S.active=null;save();leaveWO()}return}
  const pend=sum(A.items.map(it=>it.sets.filter(s=>!s.done&&(s.w!==''||s.r!=='')).length));
  if(pend&&!await ask('Terminer la séance ?',`${plural(pend,'série')} remplie${pend>1?'s':''} mais non validée${pend>1?'s':''} ne ser${pend>1?'ont':'a'} pas comptée${pend>1?'s':''}.`,'Terminer'))return;
  finish()},
 chk:b=>{const A=S.active,i=+b.dataset.i,j=+b.dataset.j,it=A&&A.items[i],s=it&&it.sets[j];if(!s)return;unlock();
  if(s.done){s.done=false;s.pr=false;if(A.rest&&A.rest.i===i&&A.rest.j===j)A.rest=null;save();renderWO();return}
  const prev=lastSets(it.ex),ph=prev?(prev.sets[j]||prev.sets[prev.sets.length-1]):null;
  const bs=it.base||0;let w=num(s.w),r=num(s.r);if(isNaN(w))w=ph?Math.max(0,ph.w-bs):0;if(isNaN(r))r=ph?ph.r:NaN;
  if(!(r>0)){toast('Indique le nombre de répétitions');const x=$(`input[data-f="r"][data-i="${i}"][data-j="${j}"]`);x&&x.focus();return}
  w=Math.max(0,w);r=Math.round(r);const now=Date.now();
  if(A.rest){const p=A.items[A.rest.i]&&A.items[A.rest.i].sets[A.rest.j];if(p&&p.done&&!(num(p.rest)>0))p.rest=String(Math.round((now-A.rest.t0)/1000))}
  s.w=fmtIn(w);s.r=String(r);s.done=true;s.t=now;s.pr=isPr(it,j,w+bs,r);
  for(let k=j+1;k<it.sets.length;k++){const x=it.sets[k];if(x.done)continue;if(x.w===''||x.aw){x.w=s.w;x.aw=true}if(x.r===''||x.ar){x.r=s.r;x.ar=true}}
  A.rest={i,j,t0:now,target:it.rest,alerted:false};save();renderWO();
  if(s.pr)toast(`Nouveau record : ${exInfo(it.ex).n}, ${setTxt({w:w+bs,r})}`,'pr');
  try{S.settings.sound&&navigator.vibrate&&navigator.vibrate(30)}catch(e){}},
 setAdd:b=>{const it=S.active.items[+b.dataset.i],l=it.sets[it.sets.length-1],n=blank();if(l){n.w=l.w;n.r=l.r;n.aw=!!l.w;n.ar=!!l.r}it.sets.push(n);save();renderWO()},
 setDel:b=>{const A=S.active,i=+b.dataset.i,it=A.items[i];if(it.sets.length<2)return;if(A.rest&&A.rest.i===i&&A.rest.j===it.sets.length-1)A.rest=null;it.sets.pop();save();renderWO()},
 exRest:b=>{REI=+b.dataset.i;restSheet()},
 exBase:b=>{BEI=+b.dataset.i;baseSheet()},
 bsAdj:b=>{const it=S.active.items[BEI];it.base=clamp(Math.round(((it.base||0)+ +b.dataset.d)*10)/10,0,300);S.base=S.base||{};S.base[it.ex]=it.base;save();baseSheet()},
 bsSet:b=>{const it=S.active.items[BEI];it.base=+b.dataset.v;S.base=S.base||{};S.base[it.ex]=it.base;save();baseSheet()},
 rtAdj:b=>{const it=S.active.items[REI];it.rest=clamp(it.rest+ +b.dataset.d,15,600);if(S.active.rest&&S.active.rest.i===REI)S.active.rest.target=it.rest;save();restSheet()},
 rtSet:b=>{const it=S.active.items[REI];it.rest=+b.dataset.v;if(S.active.rest&&S.active.rest.i===REI)S.active.rest.target=it.rest;save();restSheet()},
 exMenu:b=>{const i=+b.dataset.i,it=S.active.items[i],n=S.active.items.length;sheet(esc(exInfo(it.ex).n),`<div class="list"><div class="g2"><button class="btn line" data-a="exMove" data-i="${i}" data-d="-1"${i?'':' disabled'}>${ic('up')} Monter</button><button class="btn line" data-a="exMove" data-i="${i}" data-d="1"${i<n-1?'':' disabled'}>${ic('down')} Descendre</button></div><button class="btn line full" data-a="seeEx" data-ex="${esc(it.ex)}">${ic('chart')} Voir la progression</button><button class="btn line warn full" data-a="exDel" data-i="${i}">${ic('trash')} Retirer de la séance</button></div>`)},
 exMove:b=>{const A=S.active,i=+b.dataset.i,k=i+ +b.dataset.d;if(k<0||k>=A.items.length)return;[A.items[i],A.items[k]]=[A.items[k],A.items[i]];if(A.rest){if(A.rest.i===i)A.rest.i=k;else if(A.rest.i===k)A.rest.i=i}save();closeSheet();renderWO()},
 exDel:async b=>{const A=S.active,i=+b.dataset.i,it=A.items[i];if(it.sets.some(s=>s.done)&&!await ask('Retirer cet exercice ?','Ses séries validées seront perdues.','Retirer',true))return;
  A.items.splice(i,1);if(A.rest){if(A.rest.i===i)A.rest=null;else if(A.rest.i>i)A.rest.i--}save();closeSheet();renderWO()},
 rAdj:b=>{const R=S.active.rest;if(!R)return;R.target=Math.max(15,R.target+ +b.dataset.d);if((Date.now()-R.t0)/1000<R.target)R.alerted=false;save();tick()},
 rGo:()=>{const A=S.active,R=A.rest;if(!R)return;const p=A.items[R.i]&&A.items[R.i].sets[R.j];if(p)p.rest=String(Math.round((Date.now()-R.t0)/1000));A.rest=null;save();renderWO()},
 seeEx:b=>{P.ex=b.dataset.ex;P.m='e1';P.scroll=true;closeSheet(true);if(woOpen){closeWO();woPushed=false}if(route==='progres'&&location.hash==='#progres'){render()}else location.replace('#progres')},
 pm:b=>{P.m=b.dataset.m;render()},
 sess:b=>openSess(b.dataset.id),
 seEdit:()=>{openSess(SE.id,true)},
 seCancel:()=>{SE.edit=false;SE.dr=null;renderSess()},
 seSetDel:b=>{syncSE();SE.dr.items[+b.dataset.i].sets.splice(+b.dataset.j,1);renderSess()},
 seSave:()=>{syncSE();const dr=SE.dr;dr.name=(dr.name||'').trim()||'Séance';
  dr.items=dr.items.map(it=>({...it,sets:it.sets.map(x=>({w:Math.max(0,num(x.w)||0),r:Math.round(num(x.r)||0),rest:num(x.rest)>0?Math.round(num(x.rest)):null})).filter(x=>x.r>0)})).filter(it=>it.sets.length);
  if(!dr.items.length){toast('Une séance doit garder au moins une série');return}
  const k=S.sessions.findIndex(x=>x.id===SE.id);S.sessions[k]=dr;save();SE.edit=false;SE.dr=null;renderSess();render();toast('Séance modifiée')},
 seDel:async()=>{const id=SE.id;if(!await ask('Supprimer cette séance ?','Elle disparaîtra de ton historique, de tes courbes et de ton XP.','Supprimer',true))return;S.sessions=S.sessions.filter(x=>x.id!==id);save();render();toast('Séance supprimée')},
 seRepeat:()=>{const s=S.sessions.find(x=>x.id===SE.id);closeSheet();if(s)startWO(null,s)},
 saveTpl:async b=>{const s=S.sessions.find(x=>x.id===b.dataset.id);if(!s)return;const items=s.items.map(i=>({ex:i.ex,n:i.sets.length,rest:i.rest||S.settings.rest}));
  const t=S.templates.find(x=>x.name.trim().toLowerCase()===s.name.trim().toLowerCase());
  if(t){if(!await ask('Mettre à jour le modèle ?',`« ${t.name} » existe déjà. Il reprendra les exercices, séries et repos de cette séance.`,'Mettre à jour'))return;t.items=items;toast(`Modèle « ${t.name} » mis à jour`)}else{S.templates.push({id:uid(),name:s.name,items});toast('Modèle enregistré')}save();closeSheet();render()},
 bwDel:b=>{S.body=S.body.filter(e=>e.d!==b.dataset.d);save();render()},
 goalNew:()=>{GN={type:'lift',ex:null};renderGN()},
 gType:b=>{GN.type=b.dataset.t;renderGN()},
 gCreate:()=>{const t=GN.type,g={id:uid(),type:t,created:Date.now()};
  if(t==='lift'){g.ex=$('#gex').value;g.kg=num($('#gkg').value);g.reps=Math.round(num($('#grp').value));if(!(g.kg>=0)||!(g.reps>0)){toast('Indique une charge et des répétitions');return}}
  else if(t==='sessions'){g.n=Math.round(num($('#gn').value));g.until=$('#gun').value||null;if(!(g.n>0)){toast('Indique un nombre de séances');return}}
  else{g.from=num($('#gfrom').value);g.kg=num($('#gto').value);if(!(g.from>20)||!(g.kg>20)||g.from===g.kg){toast('Indique deux poids différents');return}
   if(!S.body.length){S.body.push({d:ymd(Date.now()),kg:g.from})}}
  S.goals.push(g);save();closeSheet();render();toast('Objectif créé')},
 goalDel:async b=>{const id=b.dataset.id;if(!await ask('Supprimer cet objectif ?','Si tu l’avais atteint, son XP sera retiré.','Supprimer',true))return;S.goals=S.goals.filter(g=>g.id!==id);save();render()},
 setGoal:b=>{S.settings.goal=clamp(S.settings.goal+ +b.dataset.d,1,7);save();render()},
 setRest:b=>{S.settings.rest=clamp(S.settings.rest+ +b.dataset.d,15,600);save();render()},
 exp:()=>{EXP=exportJson();let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'t.json',{type:'application/json'})]}))}catch(e){}
  sheet('Exporter mes données',`<p class="mute">Un fichier avec toutes tes séances, modèles, objectifs et pesées. Range-le dans Google Drive pour pouvoir le restaurer sur un autre appareil.</p><div class="list mt16">${can?`<button class="btn pri full" data-a="expShare">${ic('share')} Partager vers Drive, mail…</button>`:''}<button class="btn ${can?'line':'pri'} full" data-a="expDl">${ic('dl')} Télécharger le fichier</button><button class="btn line full" data-a="expCopy">${ic('copy')} Copier le texte</button></div>`)},
 expShare:async()=>{const name=`fonte-sauvegarde-${ymd(Date.now())}.json`;try{await navigator.share({files:[new File([EXP],name,{type:'application/json'})],title:'Sauvegarde Fonte'});S.lastExport=Date.now();save();closeSheet();render();toast('Sauvegarde partagée')}catch(e){if(e&&e.name!=='AbortError')toast('Partage impossible ici')}},
 expDl:()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([EXP],{type:'application/json'}));a.download=`fonte-sauvegarde-${ymd(Date.now())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);S.lastExport=Date.now();save();closeSheet();render();toast('Téléchargement lancé')}catch(e){toast('Téléchargement impossible ici')}},
 expCopy:async()=>{try{await navigator.clipboard.writeText(EXP);S.lastExport=Date.now();save();closeSheet();render();toast('Sauvegarde copiée')}catch(e){toast('Copie impossible ici')}},
 imp:()=>$('#impFile').click(),
 impPaste:()=>{const t=$('#impTxt').value.trim();if(t)doImport(t);else toast('Colle d’abord une sauvegarde')},
 install:async()=>{if(!BIP)return;BIP.prompt();try{await BIP.userChoice}catch(e){}BIP=null;render()},
 customDel:b=>{S.custom=S.custom.filter(x=>x.id!==b.dataset.id);EXM=null;save();render()},
 wipe:async()=>{if(!await ask('Tout effacer ?','Séances, modèles, objectifs et pesées seront supprimés de ce téléphone. Pense à exporter avant.','Tout effacer',true))return;S=fresh();EXM=null;save();render();toast('Données effacées')},
 pkM:b=>{PK.m=b.dataset.m;$$('#pkm button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===PK.m));renderPk()},
 pkT:b=>{const id=b.dataset.id;if(!PK.multi){const f=PK.onPick;closeSheet();f([id]);return}PK.sel.has(id)?PK.sel.delete(id):PK.sel.add(id);renderPk()},
 pkNew:()=>{PK.newM=true;renderPk()},
 pkNewM:b=>{const x={id:'c-'+uid(),n:PK.q.trim().slice(0,50),m:b.dataset.m};S.custom.push(x);EXM=null;save();PK.sel.add(x.id);PK.q='';PK.newM=false;$('#pkq').value='';renderPk();toast('Exercice créé');if(!PK.multi){const f=PK.onPick;closeSheet();f([x.id])}},
 pkOk:()=>{const f=PK.onPick,ids=[...PK.sel];closeSheet();f(ids)},
 poke:()=>gPoke(),
 replayEvo:()=>{const L=derive().lv.L,i=formOf(L);gAudio();if(i>0)playEvolution(i-1,i,L,null,false);else playEvolution(0,1,GF[1].l,null,true)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='pkq'&&PK){PK.q=t.value;PK.newM=false;renderPk();return}
 const f=t.dataset&&t.dataset.f;if(!f||!S.active)return;
 if(f==='name')S.active.name=t.value;else{const i=+t.dataset.i,j=+t.dataset.j,it=S.active.items[i],s=it&&it.sets[j];if(s){s[f]=t.value;if(f==='w'||f==='r'){delete s['a'+f];for(let k=j+1;k<it.sets.length;k++){const x=it.sets[k];if(x.done)continue;if(x[f]===''||x['a'+f]){x[f]=t.value;x['a'+f]=true;const el=$(`input[data-f="${f}"][data-i="${i}"][data-j="${k}"]`);if(el)el.value=t.value}else break}}}}
 saveSoon()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='pex'){P.ex=t.value;render()}
 else if(t.id==='gex'&&GN){GN.ex=t.value;const kgv=$('#gkg').value,rp=$('#grp').value;renderGN();$('#gkg').value=kgv;$('#grp').value=rp}
 else if(t.dataset.set){S.settings[t.dataset.set]=t.checked;save()}
 else if(t.id==='gname'){S.settings.gusName=t.value.trim().slice(0,16)||'Gus';save();toast(`Ton compagnon s’appelle ${gName()}`)}
 else if(t.id==='impFile'&&t.files&&t.files[0]){t.files[0].text().then(doImport);t.value=''}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='bw'){const v=num($('#bwIn').value);if(!(v>20&&v<400)){toast('Indique un poids valide');return}
 const d=ymd(Date.now()),x=S.body.find(b=>b.d===d);if(x)x.kg=v;else S.body.push({d,kg:v});save();render();toast(x?'Pesée du jour mise à jour':'Pesée notée')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='poke'){e.preventDefault();gPoke()}});
window.addEventListener('hashchange',onHash);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();BIP=e;if(route==='reglages')render()});
window.addEventListener('storage',e=>{if(e.key===KEY){S=load();D=null;EXM=null;render();if(woOpen)renderWO()}});
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
onHash();
}
</script>
