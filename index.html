<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fonte</title>
<meta name="theme-color" content="#0e0d1f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* VOICE: outil de salle net et énergique, lisible d'une main entre deux séries
   IDEA: un compagnon en pixel art grandit avec tes séances et évolue toujours quand l'une d'elles se termine
   PICTURE: sa scène animée ouvre l'accueil ; l'interface reprend ses angles en escalier et ses barres segmentées, sans décor de vieux jeu
   COLOUR and TYPE: nuit indigo, un accent pris au compagnon (braise, or, givre, sève), rouge pour les records ; Barlow Condensed + Barlow, Pixelify Sans réservée aux noms et aux gros chiffres
   LAYOUT: colonne mobile de 560px max, onglets en bas, séance plein écran avec minuteur de repos ancré en bas */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/pixelify-sans-latin-600-normal.woff2) format('woff2')}
:root{color-scheme:dark;
 --bg:#0e0d1f;--card:#18162f;--card2:#221f3f;--card3:#2e2a55;--ink:#efecff;--mute:#a7a3cc;--line:#2e2a55;
 --acc:#f4bf26;--acc-ink:#15122b;--asoft:color-mix(in srgb,var(--acc) 17%,var(--card));
 --red:#ff6f6a;--rsoft:#3d1a2c;--grn:#5fdc97;--gsoft:#173527;--yel:#f4bf26;
 --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fc:'Barlow Condensed','Barlow',system-ui,sans-serif;--fp:'Pixelify Sans','Barlow Condensed',system-ui,sans-serif;
 --st2:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px));--st3:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));--sttop:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% 100%,0 100%);}
:root[data-pet="0"]{--acc:#ff9150}:root[data-pet="1"]{--acc:#f6c64a}:root[data-pet="2"]{--acc:#7ad8ff}:root[data-pet="3"]{--acc:#a8e25e}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
h1{font:700 34px/1.05 var(--fc);margin:0;text-wrap:balance}
h2{font:700 22px/1.15 var(--fc);margin:0}
h3{font:700 18px/1.2 var(--fc);margin:0}
p{margin:0}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(96px + env(safe-area-inset-bottom))}
body.live #app{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:12px}
.brand{font:600 28px/1 var(--fp);display:flex;align-items:center;gap:10px;letter-spacing:.01em}
.brand svg{width:28px;height:28px;display:block}
.sec{margin-top:28px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;min-height:44px}
.card{background:var(--card);clip-path:var(--st3);padding:16px}
.list{display:grid;gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font:700 26px/1 var(--fc)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1}
.btn{appearance:none;border:0;clip-path:var(--st2);min-height:44px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--ink);white-space:nowrap}
.btn:active:not(:disabled){filter:brightness(1.15)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.big{min-height:58px;width:100%;font:700 21px var(--fc)}
.btn.warn{color:var(--red)}
.btn.del{background:var(--red);color:#1d0b10}
.btn.full{width:100%}
.btn .i{width:20px;height:20px}
/* contour pixel : fond = trait, ::before = intérieur découpé en escalier */
.btn.line,.dot,.chk,.pick .ck{position:relative;isolation:isolate;background:var(--card3)}
.btn.line::before,.dot::before,.chk::before,.pick .ck::before{content:'';position:absolute;inset:2px;background:var(--card);clip-path:var(--st2);z-index:-1}
.ib{appearance:none;width:44px;height:44px;flex:none;border:0;clip-path:var(--st2);display:grid;place-items:center;background:transparent;color:inherit;font-weight:600;font-size:15px}
.ib.bg{background:var(--card2)}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.i.k{stroke-width:3.5}.i.s{width:16px;height:16px}
:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.link{appearance:none;background:none;border:0;padding:0 2px;min-height:44px;color:var(--acc);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;clip-path:var(--st2);background:var(--card2);font-size:13px;font-weight:600;white-space:nowrap;border:0;color:inherit}
.chip.pr{background:var(--rsoft);color:var(--red)}
.chip.ok{background:var(--gsoft);color:var(--grn)}
/* barres segmentées */
.pbar,.xpbar,.pb2{position:relative;background:var(--card3);overflow:hidden;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent 0 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent 0 10%)}
.pbar{height:8px}
.pbar>i{display:block;height:100%;background:var(--acc)}
.pbar.b>i{background:var(--acc)}
.xpbar,.pb2{height:12px;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(5% - 2px),transparent 0 5%);mask:repeating-linear-gradient(90deg,#000 0 calc(5% - 2px),transparent 0 5%)}
.xpbar>i{display:block;height:100%;background:var(--acc)}
.pb2 i{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--acc) 55%,var(--card3))}
.pb2 i.nw{background:var(--acc);transform-origin:left;animation:gr .9s .25s steps(8) both}
@keyframes gr{from{transform:scaleX(0)}}
.gain{background:var(--card2);clip-path:var(--st2);padding:12px 14px}
/* compagnon */
.pet{background:var(--card);clip-path:var(--st3)}
.pet-v{position:relative;background:#05040f;line-height:0}
.pet-v canvas{display:block;width:100%;height:auto;aspect-ratio:256/240;touch-action:manipulation;cursor:pointer}
.pet-b{padding:14px 16px 16px}
.pet-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pet-k{font-size:13px;font-weight:600;color:var(--mute)}
.pet-n{font:600 30px/1.05 var(--fp);margin-top:4px}
.pet-l{font:700 26px/1 var(--fc);text-align:right}.pet-l span{display:block;font:600 13px/1.2 var(--f);color:var(--mute);margin-bottom:2px}
.pet-b .xpbar{margin-top:14px}
.pet-f{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-top:8px;color:var(--mute);flex-wrap:wrap}
.pet-f b{color:var(--ink);font-weight:600}
.pet-note{margin-top:12px;padding:10px 12px;background:var(--asoft);clip-path:var(--st2);font-size:14px;display:flex;gap:10px;align-items:center;line-height:1.35}
.pet-note .i{color:var(--acc)}
.pet-bub{position:absolute;left:10px;top:10px;max-width:min(78%,300px);background:rgb(14 13 31 / .9);color:var(--ink);font-size:14px;line-height:1.35;font-weight:500;padding:9px 12px;clip-path:var(--st2);opacity:0;transform:translateY(-4px);transition:opacity .2s steps(3),transform .2s steps(3);pointer-events:none}
.pet-bub.on{opacity:1;transform:none}
.pet-x{text-align:center;padding:24px 16px}
.pet-x p{margin:8px auto 16px;max-width:32ch}
/* choix du compagnon */
.choose{position:fixed;inset:0;z-index:65;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:none}
.choose.on{display:block}
.ch-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px 0}
.kick{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.ch-v{margin-top:20px;background:#05040f;clip-path:var(--st3);line-height:0}
.ch-v canvas{display:block;width:100%;height:auto;aspect-ratio:256/240}
.ch-d{margin-top:16px}
.ch-cta{position:sticky;bottom:0;margin-top:8px;padding:20px 0 calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(rgb(14 13 31 / 0),var(--bg) 36%)}
.ch-cta .row{gap:8px}
.ch-n{font:600 28px/1.05 var(--fp)}
.ch-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.ch-c{appearance:none;border:0;padding:8px 4px 10px;background:var(--card);clip-path:var(--st2);display:grid;justify-items:center;gap:6px;color:var(--ink);position:relative}
.ch-c canvas{width:100%;aspect-ratio:1;object-fit:contain}
.ch-c b{font:600 15px/1.1 var(--fp)}
.ch-c span{font-size:12px;color:var(--mute);line-height:1.1}
.ch-c[aria-pressed=true]{background:var(--card3);box-shadow:inset 0 -3px 0 var(--c)}
/* évolution */
.evo{position:fixed;inset:0;z-index:70;background:#05040f;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.evo.on{display:flex}
.evo-t{text-align:center;min-height:92px}
.evo-n{font:600 34px/1.1 var(--fp);margin-top:8px;text-wrap:balance}
.evo-s{color:var(--mute);margin-top:6px;font-size:15px}
.evo canvas{display:block;width:min(100%,540px,calc((100dvh - 320px)*256/240));height:auto;aspect-ratio:256/240;clip-path:var(--st3)}
.evo-a{width:min(100%,380px);min-height:58px;display:grid;align-items:center}
.evo .btn.line::before{background:#05040f}
/* collection */
.col{display:grid;gap:20px}
.col-h{display:flex;align-items:baseline;gap:10px}
.col-h b{font:600 20px/1.1 var(--fp)}
.col-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.col-c{display:grid;gap:6px;text-align:center}
.col-i{background:var(--card2);clip-path:var(--st2);padding:8px;line-height:0}
.col-i canvas{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}
.col-c.cur .col-i{background:var(--asoft);box-shadow:inset 0 -3px 0 var(--acc)}
.col-c span{font-size:13px;font-weight:600;line-height:1.15}
.col-c.lock span{color:var(--mute);font-weight:500}
.set-th{width:56px;height:56px;flex:none;background:var(--card2);clip-path:var(--st2);padding:6px;object-fit:contain}
/* semaine */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.day{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mute)}
.dot{width:36px;height:36px;clip-path:var(--st2);display:grid;place-items:center}
.dot .i{width:18px;height:18px;stroke-width:3}
.day.on .dot{background:var(--acc);color:var(--acc-ink)}.day.on .dot::before{display:none}
.day.today .dot{background:var(--acc)}.day.today{color:var(--ink);font-weight:700}
.streak{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:2px solid var(--card2);font-size:15px;flex-wrap:wrap}
.streak .i{color:var(--red)}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.q .pbar{grid-column:1/-1}
.q .qt{font-weight:600}
.q.done .pbar>i{background:var(--grn)}
.tpl h3{font-size:20px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0;min-height:44px}
.demo{display:flex;align-items:center;gap:12px;background:var(--asoft);clip-path:var(--st2);padding:8px 8px 8px 14px;margin-bottom:12px;font-size:14px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--card3);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{appearance:none;border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--mute);position:relative}
.nav button[aria-current=page]{color:var(--acc)}
.nav button[aria-current=page]::before{content:'';position:absolute;top:0;left:50%;width:24px;height:3px;margin-left:-12px;background:var(--acc)}
#live{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:19;padding:0 12px 8px;display:flex;justify-content:center;pointer-events:none}
#live button{pointer-events:auto;width:100%;max-width:536px;min-height:52px;border:0;clip-path:var(--st3);background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600}
.pulse{width:10px;height:10px;background:var(--acc);animation:pu 1.6s steps(2) infinite}
#live .pulse{background:#d7322d}
@keyframes pu{50%{opacity:.25}}
/* séance */
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.wo[hidden]{display:none}
.wo-h{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:2px solid var(--card2);padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.wo-hi{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.wo-name{width:100%;border:0;background:transparent;font:700 22px/1.1 var(--fc);padding:6px;clip-path:var(--st2)}
.wo-name:focus{background:var(--card2);outline:none}
.clock{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;padding:0 6px}
.wo-b{max-width:560px;margin:0 auto;padding:14px 12px calc(150px + env(safe-area-inset-bottom));display:grid;gap:12px}
.ex{background:var(--card);clip-path:var(--st3);padding:12px}
.ex-h{display:flex;gap:4px;align-items:flex-start}
.ex-n{font:700 20px/1.15 var(--fc);padding-top:4px}
.ex-m{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ex-m .chip{min-height:32px;padding:0 10px}
.prev{font-size:13px;color:var(--mute);margin:8px 0 10px}
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 50px 48px;gap:6px;align-items:center}
.rsd{text-align:center;font-size:14px;color:var(--mute)}
.sr{display:contents}
.sets .hd{font-size:13px;color:var(--mute);text-align:center;font-weight:600;line-height:1.2}
.sn{font:700 16px var(--fc);text-align:center;color:var(--mute)}
.sets input{width:100%;height:46px;border:0;clip-path:var(--st2);background:var(--card2);font-weight:600;font-size:18px;text-align:center;padding:0 2px;font-variant-numeric:tabular-nums}
.sets input:focus{outline:none;background:var(--card3);box-shadow:inset 0 -3px 0 var(--acc)}
.sets input.rs{font-size:16px;font-weight:500}
.sets input::placeholder{color:var(--mute);opacity:.6;font-weight:500}
.chk{width:48px;height:46px;border:0;clip-path:var(--st2);display:grid;place-items:center;color:var(--mute)}
.chk .i{stroke-width:3}
.sr.done input{background:var(--asoft)}
.sr.done .chk{background:var(--acc);color:var(--acc-ink)}.sr.done .chk::before{display:none}
.sr.pr .sn{color:var(--red)}
.ex-f{display:flex;gap:8px;margin-top:10px}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.rest-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 10px;align-items:center}
.rest .t{font:600 38px/1 var(--fp);font-variant-numeric:tabular-nums}
.rest .l{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .adj{display:flex;gap:6px}
.rest .ib{background:rgb(14 13 31 / .12)}
.rest .go{background:var(--bg);color:var(--ink)}
.rest .trk{grid-column:1/-1;height:6px;background:rgb(14 13 31 / .16);-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(5% - 2px),transparent 0 5%);mask:repeating-linear-gradient(90deg,#000 0 calc(5% - 2px),transparent 0 5%)}
.rest .trk i{display:block;height:100%;background:var(--bg)}
.rest.over{background:var(--acc);color:var(--acc-ink)}
.rest.over .go{background:var(--acc-ink);color:var(--acc)}
.rest.over .trk i{background:var(--acc-ink)}
/* feuilles */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(5 4 15 / .7);display:flex;align-items:flex-end;justify-content:center;animation:fa .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;clip-path:var(--sttop);padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sh-h{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:center;gap:8px;padding:16px 0 10px}
.sh-h h2{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fa{from{opacity:0}}
.fld{display:grid;gap:6px}.fld>span{font-size:14px;font-weight:600;color:var(--mute)}
.in{width:100%;min-height:48px;border:0;clip-path:var(--st2);background:var(--card2);padding:0 14px;font-size:16px}
.in:focus{outline:none;background:var(--card3);box-shadow:inset 0 -3px 0 var(--acc)}
select.in{appearance:none;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
textarea.in{padding:12px 14px;min-height:120px;font-size:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.sw{appearance:none;width:52px;height:30px;clip-path:var(--st2);background:var(--card3);position:relative;flex:none;margin:0;cursor:pointer}

.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--card2)}
.setrow:last-child{border-bottom:0;padding-bottom:0}.setrow:first-child{padding-top:0}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:2px solid var(--card2);padding:10px 2px;min-height:58px}
.pick .ck{width:26px;height:26px;display:grid;place-items:center;flex:none;clip-path:var(--st2)}
.pick .ck .i{width:16px;height:16px;stroke-width:3}
.pick[aria-pressed=true] .ck{background:var(--acc);color:var(--acc-ink)}.pick[aria-pressed=true] .ck::before{display:none}
.pk-f{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--card);padding:12px 0 calc(8px + env(safe-area-inset-bottom));margin-bottom:calc(-20px - env(safe-area-inset-bottom))}
.te{background:var(--card2);clip-path:var(--st2);padding:10px 12px}

.te-c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 10px}
.bdg{display:grid;justify-items:center;text-align:center;gap:4px;align-content:start}
.bdg svg{width:64px;height:64px}
.bdg b{font:700 16px/1.1 var(--fc);margin-top:2px}
.bdg span{font-size:13px;color:var(--mute);line-height:1.3}
.bdg.off b{color:var(--mute)}

.kpi .v{font:700 30px/1.1 var(--fc);margin:2px 0}
.kpi .d{font-size:13px}.up{color:var(--grn)}.dn{color:var(--red)}

.cols i.cur{background:var(--acc)}
.cols-x{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.mrow .pbar{height:10px}.mrow>span:last-child{text-align:right}
.fig{position:relative;height:230px;margin-top:12px}
.fig.s{height:180px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.c-ar{fill:var(--acc);opacity:.1}
.c-gl{stroke:var(--card2);stroke-width:1}
.c-pt{fill:var(--card);stroke:var(--acc);stroke-width:2}

.lgd{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:6px;vertical-align:0}
.lgd.y{height:3px;width:16px;background:var(--yel);vertical-align:3px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:16px}
.stats b{display:block;font:700 22px/1.15 var(--fc)}
.hl{display:grid;gap:10px;margin-top:16px}
.hl>div{display:flex;gap:10px;align-items:baseline;font-size:14px;border-top:2px solid var(--card2);padding-top:10px;flex-wrap:wrap}
/* historique */
.month{font:700 18px var(--fc);color:var(--mute);margin:24px 0 10px;text-transform:capitalize}
.hc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;clip-path:var(--st3);padding:12px 14px;font:inherit;color:inherit}
.hd-day{width:44px;flex:none;text-align:center;line-height:1.05}
.hd-day b{display:block;font:700 28px var(--fc)}
.hd-day span{font-size:13px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;color:var(--mute)}
.sd{border-top:2px solid var(--card2);padding-top:12px;margin-top:12px}
.dl{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px;font-size:15px;align-items:center;margin-top:6px}
.dl .sn{font-size:15px}
.ed{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin-top:8px}
.ed input{width:100%;height:44px;border:0;clip-path:var(--st2);background:var(--card2);text-align:center;font-weight:600;font-size:16px}
.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.k3>div{background:var(--card2);clip-path:var(--st2);padding:10px 12px}
.k3 b{display:block;font:700 22px/1.1 var(--fc)}
/* résumé */
.xpbig{font:600 56px/1 var(--fp);color:var(--acc)}
.brk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-size:15px}
.brk b{text-align:right;font-variant-numeric:tabular-nums}
.lvup{background:var(--acc);color:var(--acc-ink);clip-path:var(--st2);padding:14px;display:flex;gap:12px;align-items:center;margin-top:16px}
.lvup canvas{width:48px;height:48px;flex:none;object-fit:contain}
details.xpd summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;min-height:28px;cursor:pointer}
details.xpd summary::-webkit-details-marker{display:none}
details.xpd[open] summary .i{transform:rotate(180deg)}
details summary{cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;clip-path:var(--st2);font-weight:600;width:max-content;max-width:calc(100% - 32px);transition:transform .25s;pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#toast.pr{background:var(--red);color:#1d0b10}
.empty{text-align:center;padding:28px 16px}
.empty p{margin:8px auto 16px;max-width:30ch}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{

['curl-barre','Curl barre','biceps'],['curl-halt','Curl haltères','biceps'],['curl-marteau','Curl marteau','biceps'],['curl-pupitre','Curl pupitre','biceps'],
['ext-poulie','Extension triceps poulie','triceps'],['barre-front','Barre au front','triceps'],['ext-nuque','Extension nuque haltère','triceps'],
['squat','Squat','quadris'],['presse','Presse à cuisses','quadris'],['fentes','Fentes','quadris'],['leg-ext','Leg extension','quadris'],['goblet','Goblet squat','quadris'],

const ICON={home:'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',list:'M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01',chart:'M3 3v18h18M7 14l4-4 3 3 6-6',trophy:'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 6h3v1a3 3 0 0 1-3 3M7 6H4v1a3 3 0 0 0 3 3',sliders:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',check:'M5 12.5l4.5 4.5L19 7.5',plus:'M12 5v14M5 12h14',minus:'M5 12h14',x:'M6 6l12 12M18 6 6 18',more:'M5 12h.01M12 12h.01M19 12h.01',back:'M15 5l-7 7 7 7',up:'M6 15l6-6 6 6',down:'M6 9l6 6 6-6',edit:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',flame:'M12 3c.5 3.5 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.6 1.4-4.3 2.6-5.4.2 1.8 1 3 2.2 3.4C11 8.6 11.3 5.6 12 3z',timer:'M12 9v4l2.5 1.5M9 3h6M12 21a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15z',arrow:'M5 12h14M13 6l6 6-6 6',flag:'M5 21V4M5 4h11l-2.5 4L16 12H5',share:'M12 3v12M8 7l4-4 4 4M5 12v8h14v-8',dl:'M12 4v11M7 10l5 5 5-5M5 20h14',copy:'M9 9h11v11H9zM5 15H4V4h11v1',ul:'M12 20V9M7 14l5-5 5 5M5 4h14'};
const ic=(k,c='')=>`<svg class="i${c?' '+c:''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;
const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
const NB=' ';
const kg=w=>nf.format(w)+NB+'kg';
const tons=v=>v>=1000?nf.format(Math.round(v/100)/10)+NB+'t':nf.format(Math.round(v))+NB+'kg';
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const clk=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const dur=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?m+NB+'min':Math.floor(m/60)+NB+'h'+NB+String(m%60).padStart(2,'0')};
const e1=(w,r)=>w>0&&r>0?(r===1?w:w*(1+r/30)):0;
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:NaN};
const fmtIn=v=>String(v).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monday=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d};
const wk=t=>ymd(monday(t));
const fmtD=(t,o={day:'numeric',month:'short'})=>new Intl.DateTimeFormat('fr-FR',o).format(typeof t==='string'?new Date(t+'T12:00'):new Date(t));
const setTxt=x=>x?(x.w>0?`${nf.format(x.w)}${NB}kg × ${x.r}`:`${x.r} reps`):'—';
const plural=(n,w)=>`${n}${NB}${w}${n>1?'s':''}`;
const ago=t=>{const d=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return d<=0?'aujourd’hui':d===1?'hier':d<30?`il y a ${d}${NB}j`:fmtD(t)};
const blank=()=>({w:'',r:'',rest:'',done:false,t:0,pr:false});

/* ---------- données ---------- */
const H45=()=>({id:'t-haut45',name:'Haut du corps · 45 min',items:[{ex:'dm-machine',n:3,rest:90},{ex:'tirage-vert',n:3,rest:90},{ex:'di-halt',n:3,rest:90},{ex:'tirage-horiz',n:3,rest:75},{ex:'pec-deck',n:3,rest:60},{ex:'face-pull',n:3,rest:60},{ex:'curl-halt',n:2,rest:45},{ex:'ext-poulie',n:2,rest:45}]});
function fresh(){return{v:1,settings:{goal:3,rest:90,wake:true,sound:true},custom:[],pet:null,templates:[H45(),
 {id:'t-a',name:'Full body A',items:[{ex:'squat',n:3,rest:150},{ex:'dc-barre',n:3,rest:120},{ex:'rowing-barre',n:3,rest:120},{ex:'elev-lat',n:3,rest:60},{ex:'crunch',n:3,rest:60}]},
 {id:'t-b',name:'Full body B',items:[{ex:'sdt-roumain',n:3,rest:150},{ex:'dm-barre',n:3,rest:120},{ex:'tirage-vert',n:3,rest:90},{ex:'fentes',n:3,rest:90},{ex:'curl-halt',n:3,rest:60}]}],
 sessions:[],body:[],goals:[],active:null,demo:false,lastExport:0,base:{}}}
let storeOk=true;
function load(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t),f=fresh();return{...f,...d,settings:{...f.settings,...(d.settings||{})}}}}catch(e){storeOk=false}return fresh()}
let S=load(),D=null,saveT=0;
function save(){D=null;clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(S));storeOk=true}catch(e){storeOk=false}}
const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,400)};
const DEFAULT_BASE={'dc-barre':20,'di-barre':20,'rowing-barre':20,'souleve-terre':20,'dm-barre':20,'squat':20,'sdt-roumain':20,'hip-thrust':20,'curl-barre':10,'barre-front':10};
const baseOf=ex=>{const v=(S.base||{})[ex];return v!=null?v:(DEFAULT_BASE[ex]||0)};
let EXM=null;
const exAll=()=>LIB.concat(S.custom);
function exInfo(id){if(!EXM||EXM.size!==LIB.length+S.custom.length)EXM=new Map(exAll().map(x=>[x.id,x]));return EXM.get(id)||{id,n:'Exercice supprimé',m:'abdos'}}

/* ---------- gamification ---------- */
const need=L=>400+150*L;
function level(x){let L=1,b=0;while(L<30&&x>=b+need(L)){b+=need(L);L++}const max=L>=30;return{L,into:max?need(L):x-b,need:need(L),max}}
const QP=[
 {id:'prs',t:()=>'Bats un record personnel',g:()=>1,v:w=>w.prs},
 {id:'sets',t:c=>`Valide ${c.sets} séries`,g:c=>c.sets,v:w=>w.sets},
 {id:'vol',t:c=>`Soulève ${c.tons}${NB}t au total`,g:c=>c.tons*1000,v:w=>w.v},
 {id:'mus',t:()=>'Travaille 6 groupes musculaires',g:()=>6,v:w=>w.mus.size},
 {id:'rest',t:()=>'Tiens ton repos cible sur 15 séries',g:()=>15,v:w=>w.ok},

function pickQ(k){let s=(Math.round(new Date(k+'T00:00:00').getTime()/6048e5)%10000+10000)*9301+49297;const a=[0,1,2,3,4,5];for(let i=5;i>0;i--){s=(s*9301+49297)%233280;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,3).map(i=>QP[i])}
const BADGES=[
 ['s1','Premier pas','Terminer une première séance','1','g',c=>c.n>=1],['s10','Dix séances','Terminer 10 séances','10','y',c=>c.n>=10],['s50','Pilier','Terminer 50 séances','50','b',c=>c.n>=50],['s100','Centurion','Terminer 100 séances','100','r',c=>c.n>=100],
 ['p1','Premier record','Battre un record perso','PR','g',c=>c.prs>=1],['p25','Chasseur de records','Battre 25 records','25','b',c=>c.prs>=25],
 ['t10','Dix tonnes','Soulever 10 t au total','10t','y',c=>c.vol>=1e4],['t100','Cent tonnes','Soulever 100 t au total','100t','r',c=>c.vol>=1e5],
 ['w1','Semaine parfaite','Atteindre l’objectif hebdo','@check','g',c=>c.met>=1],['w4','Inarrêtable','Objectif hebdo 4 semaines d’affilée','4','y',c=>c.bestRun>=4],['w12','Saison complète','Objectif hebdo 12 semaines d’affilée','12','r',c=>c.bestRun>=12],

].map(([id,n,d,l,t,f])=>({id,n,d,l,t,f}));
const XPL=[['seance','Séances terminées'],['series','Séries validées'],['volume','Volume soulevé'],['records','Records'],['semaine','Objectifs hebdo'],['defis','Défis'],['objectifs','Objectifs perso'],['trophees','Trophées']];
const emptyW=k=>({k,n:0,v:0,sets:0,prs:0,mus:new Set(),ok:0,nw:0,days:new Set()});

function derive(){
 if(D)return D;
 const ss=[...S.sessions].sort((a,b)=>a.start-b.start),goal=S.settings.goal;
 const best={},bestR={},hist={},weeks={},st={},prs=[],seen=new Set();
 const xp={seance:0,series:0,volume:0,records:0,semaine:0,defis:0,objectifs:0,trophees:0};
 let tVol=0,tSets=0,tPr=0,tOk=0,early=false,night=false;
 for(const s of ss){
  const k=wk(s.start),W=weeks[k]||(weeks[k]=emptyW(k));
  let v=0,n=0,ok=0;const p=[],mus=new Set();
  for(const it of s.items){
   if(!it.sets.length)continue;
   mus.add(exInfo(it.ex).m);
   if(!seen.has(it.ex)){seen.add(it.ex);W.nw++}
   const tgt=it.rest||S.settings.rest;
   let mx=0,mr=0,mw=0,rx=0,iv=0,rs=0,rc=0,bw=null,br=null;
   for(const x of it.sets){const e=e1(x.w,x.r);v+=x.w*x.r;iv+=x.w*x.r;n++;
    if(e>mx){mx=e;bw=x}if(!x.w&&x.r>mr){mr=x.r;br=x}mw=Math.max(mw,x.w);rx=Math.max(rx,x.r);

function niceStep(x){const p=10**Math.floor(Math.log10(x)),m=x/p;return(m<1.5?1:m<3?2:m<7?5:10)*p}
function chart(host,pts,fmt,goal){
 const svg=host.querySelector('svg');
 const draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const pl=50,pr=12,pt=12,pb=28,ys=pts.map(p=>p.y).concat(goal!=null?[goal]:[]);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1e-6){lo-=1;hi+=1}const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  const t0=pts[0].t,t1=pts[pts.length-1].t,iw=W-pl-pr,ih=H-pt-pb;
  const X=t=>pl+(t1===t0?iw/2:(t-t0)/(t1-t0)*iw),Y=v=>pt+(hi-v)/(hi-lo)*ih;
  const step=niceStep((hi-lo)/3);let o='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){const y=Y(v);o+=`<line class="c-gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${esc(fmt(v,true))}</text>`}
  if(goal!=null)o+=`<line class="c-goal" x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}"/>`;
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  o+=`<path class="c-ar" d="${line}L${X(t1).toFixed(1)} ${pt+ih}L${X(t0).toFixed(1)} ${pt+ih}Z"/><path class="c-ln" d="${line}"/>`;
  const dense=pts.length>40;
  pts.forEach((p,i)=>{if(dense&&!p.pr&&i!==pts.length-1)return;o+=`<circle class="c-pt${p.pr?' pr':''}" cx="${X(p.t)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:3.5}"/>`});
  o+=`<text x="${pl}" y="${H-6}">${esc(fmtD(t0))}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(fmtD(t1))}</text>`;
  svg.innerHTML=o};
 const ro=new ResizeObserver(draw);ro.observe(svg);ROs.push(ro);
}

function makeDemo(){let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
 const A=[['squat',60,8,150,2.5],['dc-barre',50,8,120,2.5],['rowing-barre',45,10,120,2.5],['elev-lat',8,12,60,1],['crunch',0,15,60,0]];
 const B=[['sdt-roumain',60,10,150,2.5],['dm-barre',30,8,120,2.5],['tractions',0,5,120,0],['fentes',14,10,90,1],['curl-halt',10,10,60,1]];
 const st=fresh();st.demo=true;st.settings={...S.settings};
 const start=monday(Date.now());start.setDate(start.getDate()-56);
 let idx=0;
 for(let w=0;w<=8;w++)for(const dd of(w===3?[0,3]:[0,2,4])){
  const t=new Date(start);t.setDate(t.getDate()+w*7+dd);t.setHours(dd===4?9:18,Math.floor(rnd()*50),0,0);
  if(t.getTime()>Date.now()-2*3600e3)continue;
  const plan=idx%2?B:A,lv=Math.floor(idx/2);
  const items=plan.map(([ex,w0,r0,rest,inc])=>{const wt=w0+inc*Math.floor(lv*.5),rr=w0?r0:r0+Math.floor(lv/2);
   return{ex,rest,sets:[0,1,2].map(k=>({w:wt,r:Math.max(1,rr-(k&&rnd()<.55?k:0)),rest:k<2?Math.round(rest+rnd()*45-15):null}))}});
  st.sessions.push({id:'demo'+idx,name:plan===A?'Full body A':'Full body B',tpl:plan===A?'t-a':'t-b',start:t.getTime(),end:t.getTime()+(50+Math.floor(rnd()*22))*60000,items});idx++}
 for(let k=0;k<=56;k+=4){const t=new Date(start);t.setDate(t.getDate()+k);if(t.getTime()>Date.now())break;st.body.push({d:ymd(t),kg:Math.round((92.4-k*.05+rnd()*.6-.3)*10)/10})}
 const c=start.getTime();
 st.goals=[{id:'g1',type:'lift',ex:'dc-barre',kg:70,reps:5,created:c},{id:'g2',type:'sessions',n:30,until:null,created:c},{id:'g3',type:'body',kg:88,from:92.4,created:c}];
 return st}

  for(let k=j+1;k<it.sets.length;k++){const x=it.sets[k];if(x.done)continue;if(x.w===''||x.aw){x.w=s.w;x.aw=true}if(x.r===''||x.ar){x.r=s.r;x.ar=true}}
  A.rest={i,j,t0:now,target:it.rest,alerted:false};save();renderWO();
  if(s.pr)toast(`Nouveau record : ${exInfo(it.ex).n}, ${setTxt({w:w+bs,r})}`,'pr');
  try{S.settings.sound&&navigator.vibrate&&navigator.vibrate(30)}catch(e){}},
 setAdd:b=>{const it=S.active.items[+b.dataset.i],l=it.sets[it.sets.length-1],n=blank();if(l){n.w=l.w;n.r=l.r;n.aw=!!l.w;n.ar=!!l.r}it.sets.push(n);save();renderWO()},
 setDel:b=>{const A=S.active,i=+b.dataset.i,it=A.items[i];if(it.sets.length<2)return;if(A.rest&&A.rest.i===i&&A.rest.j===it.sets.length-1)A.rest=null;it.sets.pop();save();renderWO()},
 exRest:b=>{REI=+b.dataset.i;restSheet()},
 exBase:b=>{BEI=+b.dataset.i;baseSheet()},
 bsAdj:b=>{const it=S.active.items[BEI];it.base=clamp(Math.round(((it.base||0)+ +b.dataset.d)*10)/10,0,300);S.base=S.base||{};S.base[it.ex]=it.base;save();baseSheet()},
 bsSet:b=>{const it=S.active.items[BEI];it.base=+b.dataset.v;S.base=S.base||{};S.base[it.ex]=it.base;save();baseSheet()},
 rtAdj:b=>{const it=S.active.items[REI];it.rest=clamp(it.rest+ +b.dataset.d,15,600);if(S.active.rest&&S.active.rest.i===REI)S.active.rest.target=it.rest;save();restSheet()},
 rtSet:b=>{const it=S.active.items[REI];it.rest=+b.dataset.v;if(S.active.rest&&S.active.rest.i===REI)S.active.rest.target=it.rest;save();restSheet()},
 exMenu:b=>{const i=+b.dataset.i,it=S.active.items[i],n=S.active.items.length;sheet(esc(exInfo(it.ex).n),`<div class="list"><div class="g2"><button class="btn line" data-a="exMove" data-i="${i}" data-d="-1"${i?'':' disabled'}>${ic('up')} Monter</button><button class="btn line" data-a="exMove" data-i="${i}" data-d="1"${i<n-1?'':' disabled'}>${ic('down')} Descendre</button></div><button class="btn line full" data-a="seeEx" data-ex="${esc(it.ex)}">${ic('chart')} Voir la progression</button><button class="btn line warn full" data-a="exDel" data-i="${i}">${ic('trash')} Retirer de la séance</button></div>`)},
 exMove:b=>{const A=S.active,i=+b.dataset.i,k=i+ +b.dataset.d;if(k<0||k>=A.items.length)return;[A.items[i],A.items[k]]=[A.items[k],A.items[i]];if(A.rest){if(A.rest.i===i)A.rest.i=k;else if(A.rest.i===k)A.rest.i=i}save();closeSheet();renderWO()},
 exDel:async b=>{const A=S.active,i=+b.dataset.i,it=A.items[i];if(it.sets.some(s=>s.done)&&!await ask('Retirer cet exercice ?','Ses séries validées seront perdues.','Retirer',true))return;
  A.items.splice(i,1);if(A.rest){if(A.rest.i===i)A.rest=null;else if(A.rest.i>i)A.rest.i--}save();closeSheet();renderWO()},
 rAdj:b=>{const R=S.active.rest;if(!R)return;R.target=Math.max(15,R.target+ +b.dataset.d);if((Date.now()-R.t0)/1000<R.target)R.alerted=false;save();tick()},
 rGo:()=>{const A=S.active,R=A.rest;if(!R)return;const p=A.items[R.i]&&A.items[R.i].sets[R.j];if(p)p.rest=String(Math.round((Date.now()-R.t0)/1000));A.rest=null;save();renderWO()},
 seeEx:b=>{P.ex=b.dataset.ex;P.m='e1';P.scroll=true;closeSheet(true);if(woOpen){closeWO();woPushed=false}if(route==='progres'&&location.hash==='#progres'){render()}else location.replace('#progres')},
 pm:b=>{P.m=b.dataset.m;render()},
 sess:b=>openSess(b.dataset.id),
 seEdit:()=>{openSess(SE.id,true)},
 seCancel:()=>{SE.edit=false;SE.dr=null;renderSess()},
 seSetDel:b=>{syncSE();SE.dr.items[+b.dataset.i].sets.splice(+b.dataset.j,1);renderSess()},
 seSave:()=>{syncSE();const dr=SE.dr;dr.name=(dr.name||'').trim()||'Séance';
  dr.items=dr.items.map(it=>({...it,sets:it.sets.map(x=>({w:Math.max(0,num(x.w)||0),r:Math.round(num(x.r)||0),rest:num(x.rest)>0?Math.round(num(x.rest)):null})).filter(x=>x.r>0)})).filter(it=>it.sets.length);
  if(!dr.items.length){toast('Une séance doit garder au moins une série');return}
  const k=S.sessions.findIndex(x=>x.id===SE.id);S.sessions[k]=dr;save();SE.edit=false;SE.dr=null;renderSess();render();toast('Séance modifiée')},
 seDel:async()=>{const id=SE.id;if(!await ask('Supprimer cette séance ?','Elle disparaîtra de ton historique, de tes courbes et de ton XP.','Supprimer',true))return;S.sessions=S.sessions.filter(x=>x.id!==id);save();render();toast('Séance supprimée')},
 seRepeat:()=>{const s=S.sessions.find(x=>x.id===SE.id);closeSheet();if(s)startWO(null,s)},
 saveTpl:async b=>{const s=S.sessions.find(x=>x.id===b.dataset.id);if(!s)return;const items=s.items.map(i=>({ex:i.ex,n:i.sets.length,rest:i.rest||S.settings.rest}));
  const t=S.templates.find(x=>x.name.trim().toLowerCase()===s.name.trim().toLowerCase());
  if(t){if(!await ask('Mettre à jour le modèle ?',`« ${t.name} » existe déjà. Il reprendra les exercices, séries et repos de cette séance.`,'Mettre à jour'))return;t.items=items;toast(`Modèle « ${t.name} » mis à jour`)}else{S.templates.push({id:uid(),name:s.name,items});toast('Modèle enregistré')}save();closeSheet();render()},
 bwDel:b=>{S.body=S.body.filter(e=>e.d!==b.dataset.d);save();render()},
 goalNew:()=>{GN={type:'lift',ex:null};renderGN()},
 gType:b=>{GN.type=b.dataset.t;renderGN()},
 gCreate:()=>{const t=GN.type,g={id:uid(),type:t,created:Date.now()};
  if(t==='lift'){g.ex=$('#gex').value;g.kg=num($('#gkg').value);g.reps=Math.round(num($('#grp').value));if(!(g.kg>=0)||!(g.reps>0)){toast('Indique une charge et des répétitions');return}}
  else if(t==='sessions'){g.n=Math.round(num($('#gn').value));g.until=$('#gun').value||null;if(!(g.n>0)){toast('Indique un nombre de séances');return}}
  else{g.from=num($('#gfrom').value);g.kg=num($('#gto').value);if(!(g.from>20)||!(g.kg>20)||g.from===g.kg){toast('Indique deux poids différents');return}
   if(!S.body.length){S.body.push({d:ymd(Date.now()),kg:g.from})}}
  S.goals.push(g);save();closeSheet();render();toast('Objectif créé')},
 goalDel:async b=>{const id=b.dataset.id;if(!await ask('Supprimer cet objectif ?','Si tu l’avais atteint, son XP sera retiré.','Supprimer',true))return;S.goals=S.goals.filter(g=>g.id!==id);save();render()},
 setGoal:b=>{S.settings.goal=clamp(S.settings.goal+ +b.dataset.d,1,7);save();render()},
 setRest:b=>{S.settings.rest=clamp(S.settings.rest+ +b.dataset.d,15,600);save();render()},
 exp:()=>{EXP=exportJson();let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'t.json',{type:'application/json'})]}))}catch(e){}
  sheet('Exporter mes données',`<p class="mute">Un fichier avec toutes tes séances, modèles, objectifs et pesées. Range-le dans Google Drive pour pouvoir le restaurer sur un autre appareil.</p><div class="list mt16">${can?`<button class="btn pri full" data-a="expShare">${ic('share')} Partager vers Drive, mail…</button>`:''}<button class="btn ${can?'line':'pri'} full" data-a="expDl">${ic('dl')} Télécharger le fichier</button><button class="btn line full" data-a="expCopy">${ic('copy')} Copier le texte</button></div>`)},
 expShare:async()=>{const name=`fonte-sauvegarde-${ymd(Date.now())}.json`;try{await navigator.share({files:[new File([EXP],name,{type:'application/json'})],title:'Sauvegarde Fonte'});S.lastExport=Date.now();save();closeSheet();render();toast('Sauvegarde partagée')}catch(e){if(e&&e.name!=='AbortError')toast('Partage impossible ici')}},
 expDl:()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([EXP],{type:'application/json'}));a.download=`fonte-sauvegarde-${ymd(Date.now())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);S.lastExport=Date.now();save();closeSheet();render();toast('Téléchargement lancé')}catch(e){toast('Téléchargement impossible ici')}},
 expCopy:async()=>{try{await navigator.clipboard.writeText(EXP);S.lastExport=Date.now();save();closeSheet();render();toast('Sauvegarde copiée')}catch(e){toast('Copie impossible ici')}},
 imp:()=>$('#impFile').click(),
 impPaste:()=>{const t=$('#impTxt').value.trim();if(t)doImport(t);else toast('Colle d’abord une sauvegarde')},
 install:async()=>{if(!BIP)return;BIP.prompt();try{await BIP.userChoice}catch(e){}BIP=null;render()},
 customDel:b=>{S.custom=S.custom.filter(x=>x.id!==b.dataset.id);EXM=null;save();render()},
 wipe:async()=>{if(!await ask('Tout effacer ?','Séances, modèles, objectifs et pesées seront supprimés de ce téléphone. Pense à exporter avant.','Tout effacer',true))return;S=fresh();EXM=null;save();render();toast('Données effacées')},
 pkM:b=>{PK.m=b.dataset.m;$$('#pkm button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===PK.m));renderPk()},
 pkT:b=>{const id=b.dataset.id;if(!PK.multi){const f=PK.onPick;closeSheet();f([id]);return}PK.sel.has(id)?PK.sel.delete(id):PK.sel.add(id);renderPk()},
 pkNew:()=>{PK.newM=true;renderPk()},
 pkNewM:b=>{const x={id:'c-'+uid(),n:PK.q.trim().slice(0,50),m:b.dataset.m};S.custom.push(x);EXM=null;save();PK.sel.add(x.id);PK.q='';PK.newM=false;$('#pkq').value='';renderPk();toast('Exercice créé');if(!PK.multi){const f=PK.onPick;closeSheet();f([x.id])}},
 pkOk:()=>{const f=PK.onPick,ids=[...PK.sel];closeSheet();f(ids)},
 replayEvo:()=>{const p=S.pet;if(!p||!p.form)return;unlock();playEvo({c:p.c,from:p.form-1,to:p.form},null,true)},
 chFirst:()=>openChooser('first'),
 chNext:()=>{closeSheet(true);openChooser('next')},
 chSel:b=>{if(!CH)return;CH.sel=+b.dataset.c;renderChooser()},
 chOk:()=>{if(CH)choosePet()},
 chLater:()=>closeChooser(),
 petShow:b=>{const p=S.pet,c=+b.dataset.c;if(!p||!p.done.includes(c))return;p.done=p.done.filter(x=>x!==c);if(!p.done.includes(p.c))p.done.push(p.c);p.c=c;p.form=3;save();render()},
 evoSkip:()=>{if(hasPets)Pets.skipEvo()},
 evoClose:()=>closeEvo()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='pkq'&&PK){PK.q=t.value;PK.newM=false;renderPk();return}
 const f=t.dataset&&t.dataset.f;if(!f||!S.active)return;
 if(f==='name')S.active.name=t.value;else{const i=+t.dataset.i,j=+t.dataset.j,it=S.active.items[i],s=it&&it.sets[j];if(s){s[f]=t.value;if(f==='w'||f==='r'){delete s['a'+f];for(let k=j+1;k<it.sets.length;k++){const x=it.sets[k];if(x.done)continue;if(x[f]===''||x['a'+f]){x[f]=t.value;x['a'+f]=true;const el=$(`input[data-f="${f}"][data-i="${i}"][data-j="${k}"]`);if(el)el.value=t.value}else break}}}}
 saveSoon()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='pex'){P.ex=t.value;render()}
 else if(t.id==='gex'&&GN){GN.ex=t.value;const kgv=$('#gkg').value,rp=$('#grp').value;renderGN();$('#gkg').value=kgv;$('#grp').value=rp}
 else if(t.dataset.set){S.settings[t.dataset.set]=t.checked;save()}
 else if(t.id==='impFile'&&t.files&&t.files[0]){t.files[0].text().then(doImport);t.value=''}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='bw'){const v=num($('#bwIn').value);if(!(v>20&&v<400)){toast('Indique un poids valide');return}
 const d=ymd(Date.now()),x=S.body.find(b=>b.d===d);if(x)x.kg=v;else S.body.push({d,kg:v});save();render();toast(x?'Pesée du jour mise à jour':'Pesée notée')}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(SH)closeSheet();else if(CH&&CH.mode==='next')closeChooser()});
window.addEventListener('hashchange',onHash);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();BIP=e;if(route==='reglages')render()});
window.addEventListener('storage',e=>{if(e.key===KEY){S=load();D=null;EXM=null;render();if(woOpen)renderWO()}});
if(!(S.flags&&S.flags.h45)){S.flags={...(S.flags||{}),h45:1};if(!S.templates.some(t=>t.id==='t-haut45'))S.templates.unshift(H45());save()}
setAccent();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
onHash();
}
</script>
